{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Call Nurse • MedSupport</title>

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;
      background:#f6f7fb;
      color:#111;
    }

    .shell{
      max-width:520px;
      margin:0 auto;
      padding:18px;
    }

    .top{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }

    .logo{
      width:42px;
      height:42px;
      border-radius:14px;
      object-fit:contain;
      background:#fff;
      border:1px solid #e6e8f0;
      padding:6px;
    }

    .card{
      background:#fff;
      border:1px solid #e6e8f0;
      border-radius:20px;
      padding:18px;
      box-shadow:0 10px 25px rgba(0,0,0,.06);
    }

    .h1{
      font-size:22px;
      font-weight:900;
      margin:0 0 4px 0;
    }

    .muted{
      color:#6b7280;
      font-size:13px;
      margin:0 0 14px 0;
    }

    label{
      display:block;
      font-size:12px;
      color:#6b7280;
      margin:12px 0 6px;
    }

    input, textarea{
      width:100%;
      box-sizing:border-box;
      padding:12px;
      border-radius:14px;
      border:1px solid #e6e8f0;
      font-size:14px;
      outline:none;
      background:#fff;
    }

    textarea{
      min-height:120px;
      resize:vertical;
    }

    textarea::placeholder{
      letter-spacing:normal;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    @media (max-width:520px){
      .row{
        grid-template-columns:1fr;
      }
    }

    .btn{
      margin-top:16px;
      width:100%;
      padding:14px;
      border:none;
      border-radius:16px;
      font-weight:800;
      cursor:pointer;
      background:#6f7bf7;
      color:#fff;
      font-size:15px;
    }

    .btn2{
      margin-top:10px;
      width:100%;
      padding:14px;
      border:1px solid #e6e8f0;
      border-radius:16px;
      font-weight:800;
      cursor:pointer;
      background:#fff;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .ok{
      margin:14px 0;
      background:#ecfdf5;
      border:1px solid #a7f3d0;
      color:#065f46;
      padding:12px;
      border-radius:16px;
      font-size:13px;
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

    .nurse-photo{
      width:46px;
      height:46px;
      border-radius:14px;
      object-fit:cover;
      border:1px solid #a7f3d0;
      flex-shrink:0;
    }
  </style>
</head>

<body>
  <div class="shell">

    <div class="top">
      <img class="logo" src="{% static 'img/logo.png' %}" alt="MedSupport logo">
      <div>
        <div style="font-weight:900;">MedSupport</div>
        <div style="font-size:12px;color:#6b7280;">Call Nurse</div>
      </div>
    </div>

    <div class="card">
      <div class="h1">Request a nurse</div>
      <p class="muted">Fill the form. We’ll take care of the rest.</p>

      {% if saved %}
        <div class="ok">
          <img
            src="https://i.pravatar.cc/80?img=47"
            alt="Nurse Malika"
            class="nurse-photo"
          >
          <div>
            ✅ <b>Request received!</b><br>
            Nurse <b>Malika</b> is on the way.<br>
            ETA: {{ eta_text }}<br>
            Request ID: #{{ request_id }}
          </div>
        </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="row">
          <div>
            <label>Full name</label>
            <input name="patient_name" placeholder="Your name" required>
          </div>
          <div>
            <label>Phone</label>
            <input name="phone" placeholder="+998 ..." required>
          </div>
        </div>

        <label>Address</label>
        <input name="address" placeholder="Street, city" required>

        <label>What happened?</label>
        <textarea
          name="symptoms_text"
          placeholder="Describe symptoms or reason for nurse visit"
          required></textarea>

        <button class="btn" type="submit">Send Request</button>

        <a href="/">
          <button class="btn2" type="button">← Back to Home</button>
        </a>
      </form>
    </div>
  </div>
</body>
</html>
