{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Assistant • MedSupport</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;background:#f6f7fb;}
    .shell{max-width:520px;margin:0 auto;padding:16px;}
    .top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    .logo{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid #e6e8f0;padding:6px;object-fit:contain;}
    .card{background:#fff;border-radius:18px;padding:14px;border:1px solid #e6e8f0;box-shadow:0 10px 25px rgba(0,0,0,.06);}
    .msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;max-height:55vh;overflow:auto;padding-right:4px;}
    .msg{padding:10px 12px;border-radius:14px;font-size:14px;max-width:85%;white-space:pre-wrap;}
    .user{background:#6f7bf7;color:#fff;align-self:flex-end;}
    .bot{background:#f3f4f6;color:#111;align-self:flex-start;}
    form{display:flex;gap:8px;}
    input{flex:1;padding:12px;border-radius:14px;border:1px solid #e6e8f0;font-size:14px;outline:none;}
    button{padding:12px 14px;border:none;border-radius:14px;background:#6f7bf7;color:#fff;font-weight:800;cursor:pointer;}
    .back{margin-top:10px;display:block;text-align:center;color:#6b7280;font-size:13px;text-decoration:none;}
  </style>
</head>

<body>
  <div class="shell">
    <div class="top">
      <img class="logo" src="{% static 'img/logo.png' %}" alt="logo">
      <div>
        <div style="font-weight:900;">MedSupport</div>
        <div style="font-size:12px;color:#6b7280;">AI Assistant (Demo)</div>
      </div>
    </div>

    <div class="card">
      <div class="msgs">
        {% for m in messages %}
          <div class="msg {% if m.role == 'user' %}user{% else %}bot{% endif %}">
            {{ m.text }}
          </div>
        {% empty %}
          <div class="msg bot">
            Hello 👋 I’m your AI health assistant.<br>
            Describe your symptoms and I’ll try to help.
          </div>
        {% endfor %}
      </div>

      <form method="post">
        {% csrf_token %}
        <input name="message" placeholder="Type your message..." required>
        <button type="submit">Send</button>
      </form>
    </div>

    <a class="back" href="/">← Back to Home</a>
  </div>
</body>
</html>
