<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Map • MedSupport</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:#fff;
    }
    .shell{
      max-width:900px;
      margin:0 auto;
      padding:18px;
    }
    .card{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px;
      padding:14px;
    }
    img{
      width:100%;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
    }
    .btn{
      display:inline-block;
      margin-top:14px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:#fff;
      text-decoration:none;
      font-weight:800;
    }
    .muted{
      color:rgba(255,255,255,.7);
      font-size:13px;
    }
  </style>
</head>

<body>
  <div class="shell">
    <h2>Location (demo)</h2>
    <p class="muted">Static map image. No address shown.</p>

    {% if error %}
      <div class="card">{{ error }}</div>
    {% else %}
      <div class="card">
        <img
          alt="Map"
          src="https://staticmap.openstreetmap.de/staticmap.php?center={{ lat }},{{ lng }}&zoom=16&size=900x480&markers={{ lat }},{{ lng }},red-pushpin"
        >
      </div>
    {% endif %}

    <a class="btn" href="/">← Back to Home</a>
  </div>
</body>
</html>
