{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rate a Nurse • MedSupport</title>

  <style>
    :root{
      --bg:#0b1220; --card:rgba(255,255,255,.08); --border:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.65);
      --radius:18px; --blue:#4da3ff;
    }
    body{
      margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(900px 500px at 15% 0%, rgba(77,163,255,.22), transparent 55%),
        radial-gradient(900px 500px at 85% 10%, rgba(255,77,79,.16), transparent 60%),
        var(--bg);
      color:var(--text);
    }
    .shell{max-width:420px;margin:0 auto;padding:18px;padding-bottom:40px;}
    .topbar{
      display:flex;align-items:center;gap:12px;
      padding:14px;border-radius:var(--radius);
      background:rgba(255,255,255,.06);border:1px solid var(--border);
      backdrop-filter:blur(10px);
    }
    .logoWrap{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;}
    .logo{width:36px;height:36px;border-radius:12px;object-fit:contain;background:#fff;}
    .brandName{margin:0;font-weight:900;font-size:18px;line-height:1.05;}
    .brandSub{margin:0;font-size:12px;color:var(--muted);}
    .card{
      margin-top:14px;border-radius:22px;padding:16px;
      background:var(--card);border:1px solid rgba(255,255,255,.12);
      box-shadow:0 18px 40px rgba(0,0,0,.35);
    }
    .h1{margin:0 0 6px;font-weight:900;font-size:20px;}
    .muted{margin:0 0 12px;color:var(--muted);font-size:12px;}
    label{display:block;margin:10px 0 6px;font-size:12px;color:var(--muted);}
    .input, select, textarea{
      width:100%; box-sizing:border-box;
      padding:12px; border-radius:14px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: var(--text);
      outline:none; font-size:14px;
    }
    textarea{min-height:90px;resize:vertical;}
    .btn{
      margin-top:12px;width:100%;
      padding:12px 14px;border:none;border-radius:14px;
      cursor:pointer;font-weight:900;
      background: linear-gradient(180deg, rgba(77,163,255,.8), rgba(77,163,255,.45));
      color:#07101f;
    }
    .btnGhost{
      margin-top:10px;width:100%;
      padding:12px 14px;border-radius:14px;
      cursor:pointer;font-weight:900;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.16);
      color: var(--text);
    }
    .empty{
      margin-top:12px;padding:10px 12px;border-radius:14px;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
      color:var(--muted);font-size:13px;
    }
    a{text-decoration:none;color:inherit;}
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="logoWrap"><img class="logo" src="{% static 'img/logo.png' %}" alt="logo"></div>
      <div>
        <p class="brandName">MedSupport</p>
        <p class="brandSub">Rate a nurse</p>
      </div>
    </div>

    <div class="card">
      <div class="h1">Leave feedback</div>
      <p class="muted">Choose a nurse and rate the service.</p>

      {% if nurses|length == 0 %}
        <div class="empty">
          No approved nurses yet.<br>
          Go to Admin → Nurse profiles → set one nurse status to <b>approved</b>.
        </div>
      {% else %}
        <form method="post">
          {% csrf_token %}

          <label>Nurse</label>
          <select name="nurse_id" class="input" required>
            {% for n in nurses %}
              <option value="{{ n.id }}">{{ n.full_name }} — {{ n.city }}</option>
            {% endfor %}
          </select>

          <label>Your name (optional)</label>
          <input name="client_name" class="input" placeholder="Anonymous" />

          <label>Rating</label>
          <select name="rating" class="input">
            <option value="5">★★★★★ (5)</option>
            <option value="4">★★★★☆ (4)</option>
            <option value="3">★★★☆☆ (3)</option>
            <option value="2">★★☆☆☆ (2)</option>
            <option value="1">★☆☆☆☆ (1)</option>
          </select>

          <label>Comment</label>
          <textarea name="comment" class="input" placeholder="What went well? What can improve?"></textarea>

          <button class="btn" type="submit">Submit feedback</button>
        </form>
      {% endif %}

      <a href="/"><button class="btnGhost" type="button">← Back to Home</button></a>
    </div>
  </div>
</body>
</html>
