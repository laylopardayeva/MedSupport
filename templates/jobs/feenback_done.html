{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank you • MedSupport</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;background:#0b1220;color:rgba(255,255,255,.92);}
    .shell{max-width:420px;margin:0 auto;padding:18px;}
    .card{margin-top:14px;border-radius:22px;padding:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 40px rgba(0,0,0,.35);}
    .h1{margin:0 0 8px;font-weight:900;font-size:20px;}
    .muted{margin:0;color:rgba(255,255,255,.65);font-size:13px;}
    .btn{margin-top:14px;width:100%;padding:12px 14px;border:none;border-radius:14px;font-weight:900;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.92);}
    a{text-decoration:none;color:inherit;}
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="h1">✅ Feedback submitted</div>
      <p class="muted">Thanks! Your feedback helps <b>{{ nurse.full_name }}</b> improve.</p>
      <a href="/"><button class="btn" type="button">Back to Home</button></a>
    </div>
  </div>
</body>
</html>
